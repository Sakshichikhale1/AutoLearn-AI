services:
  # --- Backend Web Service ---
  - type: web
    name: autolearn-ai-backend
    env: docker
    repo: https://github.com/Sakshichikhale1/AutoLearn-AI
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: autolearn-ai-frontend
          type: web
          property: host

  # --- Frontend Static Site ---
  - type: web
    name: autolearn-ai-frontend
    runtime: static
    repo: https://github.com/Sakshichikhale1/AutoLearn-AI
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: autolearn-ai-backend
          type: web
          property: hostport
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
